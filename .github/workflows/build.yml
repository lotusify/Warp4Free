name: Build

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: Warp4Free.sln
  ARTIFACT: Warp4Free

jobs:
  build:
    name: ${{ matrix.configuration }} | x64
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ${{ matrix.configuration }}|x64
        run: >
          msbuild "$env:SOLUTION"
          /m
          /nologo
          /verbosity:minimal
          /fileLogger
          /fileLoggerParameters:LogFile=msbuild.binlog
          /property:Configuration=${{ matrix.configuration }}
          /property:Platform=x64
          /property:PlatformToolset=v143
          /property:WindowsTargetPlatformVersion=10.0

      - name: Collect output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = '${{ matrix.configuration }}'
          $outputDir = "x64/$config"

          if (-not (Test-Path $outputDir)) {
            throw "Build output directory '$outputDir' was not created."
          }

          $dll = Join-Path $outputDir "$env:ARTIFACT.dll"
          if (-not (Test-Path $dll)) {
            Get-ChildItem -Recurse -Filter *.dll | Select-Object -ExpandProperty FullName
            throw "Expected '$dll' but it does not exist."
          }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll out/
          # The PDB only exists for some configurations; ship it when available.
          Get-ChildItem -Path $outputDir -Filter "$env:ARTIFACT*.pdb" -ErrorAction SilentlyContinue |
            Copy-Item -Destination out/

          Get-ChildItem out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}-${{ matrix.configuration }}-x64
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSBuild log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-log-${{ matrix.configuration }}-x64
          path: msbuild.binlog
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}-Release-x64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi
